  <script src="https://cdn.jsdelivr.net/gh/mcstudios/glightbox/dist/js/glightbox.min.js">
    // Language detection for Inquiries
    document.addEventListener("DOMContentLoaded", () => {
      const userLang = navigator.language || navigator.userLanguage;
      if (userLang.toLowerCase().includes('ja')) {
        const inqBtns = document.querySelectorAll('.inquiries-btn');
        inqBtns.forEach(btn => {
          if (btn.classList.contains('cta-btn')) {
            btn.textContent = 'お問い合わせ (Book me here)';
          } else {
            btn.textContent = 'お問い合わせ';
          }
        });
      }
    });

  </script>
  <script>
    // Grid Slider Logic
    const slider = document.getElementById('grid-slider');
    const grid = document.querySelector('.portfolio-grid');
    
    // Set initial grid size
    grid.style.columns = slider.value;
    
    slider.addEventListener('input', (e) => {
      // Invert slider so sliding RIGHT makes images BIGGER (fewer columns)
      // Wait, slider is 2 to 8 columns. Usually slider right = bigger photos = fewer columns.
      // Or slider right = more columns = smaller photos. Let's just set columns directly for now.
      // If the user wants smaller photos by default, 5 columns is small.
      grid.style.columns = e.target.value;
    });

  </script>
  <script>
    // Initialize Lightbox
    const lightbox = GLightbox({
      touchNavigation: true,
      loop: true,
      selector: '.glightbox'
    });

    // Navbar Scroll Effect
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 50) {
        navbar.classList.add('scrolled');
      } else {
        navbar.classList.remove('scrolled');
      }
    });

    // Reveal Animations on Scroll
    const revealElements = document.querySelectorAll('.reveal-up');
    
    const revealObserver = new IntersectionObserver((entries, observer) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target); // Only animate once
        }
      });
    }, {
      root: null,
      threshold: 0.15, // Trigger when 15% of the element is visible
      rootMargin: "0px 0px -50px 0px" // Trigger slightly before it hits the bottom
    });

    revealElements.forEach(el => {
      revealObserver.observe(el);
    });
    
    // Ensure initial elements in viewport trigger immediately
    setTimeout(() => {
      revealElements.forEach(el => {
        const rect = el.getBoundingClientRect();
        if(rect.top < window.innerHeight) {
          el.classList.add('is-visible');
        }
      });
    }, 100);

  </script>
