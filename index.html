  <script src="https://cdn.jsdelivr.net/gh/mcstudios/glightbox/dist/js/glightbox.min.js">
    // Universal Language Detection
    document.addEventListener("DOMContentLoaded", () => {
      const userLang = navigator.language || navigator.userLanguage;
      if (userLang.toLowerCase().includes('ja')) {
        const translatableElements = document.querySelectorAll('.i18n[data-ja]');
        translatableElements.forEach(el => {
          // If the element has SVG or child elements, we only want to replace text.
          // For buttons with an SVG icon, we replace the last child text node.
          if(el.children.length > 0) {
            // It has HTML inside (like the SVG). Let's recreate it cleanly.
            const svg = el.querySelector('svg');
            if(svg) {
              el.innerHTML = '';
              el.appendChild(svg);
              el.appendChild(document.createTextNode(' ' + el.getAttribute('data-ja')));
            } else {
              el.textContent = el.getAttribute('data-ja');
            }
          } else {
            el.textContent = el.getAttribute('data-ja');
          }
        });
      }
    });

  </script>
  <script>
    // Grid Slider Logic
    const slider = document.getElementById('grid-slider');
    const grid = document.querySelector('.portfolio-grid');
    
    // Set initial grid size
    grid.style.setProperty('--cols', slider.value);
    
    slider.addEventListener('input', (e) => {
      grid.style.setProperty('--cols', e.target.value);
    });

  </script>
  <script>
    // Initialize Lightbox
    const lightbox = GLightbox({
      touchNavigation: true,
      loop: true,
      selector: '.glightbox'
    });

    // Navbar Scroll Effect
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => {
      // Reveal navbar after scrolling past the Hero section
      if (window.scrollY > 250) {
        navbar.classList.add('scrolled');
      } else {
        navbar.classList.remove('scrolled');
      }
    });

    // Reveal Animations on Scroll
    const revealElements = document.querySelectorAll('.reveal-up');
    
    const revealObserver = new IntersectionObserver((entries, observer) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target); // Only animate once
        }
      });
    }, {
      root: null,
      threshold: 0.15, // Trigger when 15% of the element is visible
      rootMargin: "0px 0px -50px 0px" // Trigger slightly before it hits the bottom
    });

    revealElements.forEach(el => {
      revealObserver.observe(el);
    });
    
    // Ensure initial elements in viewport trigger immediately
    setTimeout(() => {
      revealElements.forEach(el => {
        const rect = el.getBoundingClientRect();
        if(rect.top < window.innerHeight) {
          el.classList.add('is-visible');
        }
      });
    }, 100);

  </script>
